# Integration tests against a live Postgres service container.
#
# Runs alongside test.yml (the unit-tier workflow) on every push and
# pull request. The unit job in test.yml stays fast — no DB, no
# service spin-up — and gives PR contributors quick feedback. This
# workflow trades a few seconds of service-container boot for the
# ability to catch the v0.21.0 bug shape (migration SQL that
# references a non-existent column / wrong schema / wrong table)
# before the change merges.
#
# Why a separate workflow rather than extending test.yml: separation
# of concerns. A green "Tests" status means the unit tier passed; a
# green "Integration" status means the migration ran end-to-end
# against a real Postgres. If only one is green, the failure mode
# is obvious from the badge.

name: Integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest

    # Postgres 16 service container, empty on every job invocation.
    # AVELOXIS_TEST_DB names its database as the BASE: each test package
    # creates, migrates and drops a database of its own from it
    # (internal/testdb; the service user is a superuser, so CREATEDB).
    # health-cmd + retries ensure the steps below don't try to connect
    # before Postgres is accepting connections; ports binding to
    # 5432:5432 makes the service reachable on localhost.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aveloxis_test
          POSTGRES_PASSWORD: aveloxis_test
          POSTGRES_DB: aveloxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration test (and any future AVELOXIS_TEST_DB-gated
      # tests) read this and connect. sslmode=disable matches the
      # default postgres:16 image configuration. The DSN points at
      # localhost because GitHub Actions exposes service container
      # ports via the runner's loopback interface.
      AVELOXIS_TEST_DB: postgres://aveloxis_test:aveloxis_test@localhost:5432/aveloxis_test?sslmode=disable
      # v0.27.29 — run the ENTIRE integration tier under a non-UTC
      # timezone. The 2026-07-10 flat-line bug (date_trunc in a
      # non-UTC session vs a UTC grid → every chart value silently
      # zero) could never reproduce in CI because CI ran UTC; the
      # 2026-07-21 audit found the same class latent in metrics.go's
      # ::DATE casts. TZ makes Go's time.Local non-UTC and PGTZ makes
      # every postgres session non-UTC, so ANY Go↔SQL timezone
      # disagreement in ANY integration test now fails loudly here
      # instead of shipping. America/Chicago = the operator's zone,
      # where the original bug was live.
      TZ: America/Chicago
      PGTZ: America/Chicago

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # Run only the integration-tier tests. Filtering by name keeps
      # this job focused — the unit tests already ran in test.yml.
      # If a future integration test is added with a different
      # naming pattern, update the -run regex here.
      - name: Run migration integration tests
        run: |
          go test ./internal/db/ \
            -run "TestRunMigrationsOnFreshDB|TestRunMigrationsIsIdempotent|TestRealign" \
            -count=1 -v

      # Final sanity check: run the entire test suite with the env
      # var still set. Any other AVELOXIS_TEST_DB-gated tests that
      # exist now or get added later will run here too, against the
      # same Postgres service container.
      # -race here is deliberate (v0.25.36): test.yml runs -race but has
      # no DB, so the worker pools / KeyPool / caches never executed under
      # the race detector before this. This is the only tier where the
      # goroutine-heavy paths actually run.
      # -shuffle=on (v0.29.57): each package now runs in a fresh database of
      # its own, so a test that only passes because an earlier test left
      # rows behind is an ORDER dependency; shuffling surfaces it (one was
      # found this way: an explicit repo_group_id = 1 that collided with the
      # Default group's sequence). A failure prints `-test.shuffle N`;
      # rerun with that seed to reproduce.
      # The skip census (2026-10-13): the same run, counted — a test that
      # SKIPS without a reviewed environment reason (scripts/
      # skip_census_baseline.txt) fails the job, so a refactor can never turn
      # a test silently off. It exits non-zero on any test failure too.
      - name: Run full suite with integration tier enabled (skip census)
        env:
          SKIP_CENSUS_GOFLAGS: -race -shuffle=on
          SKIP_CENSUS_OUT: ${{ runner.temp }}/skip-census
        run: scripts/skip-census.sh

      # The census prints each failed test's output and its package's
      # shuffle seed; the whole `go test -json` stream and stderr are kept
      # here for anything the print bounded (Copilot review 5559632343).
      - name: Keep the skip census's raw output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skip-census
          path: ${{ runner.temp }}/skip-census
          if-no-files-found: ignore

      # v0.27.43: smoke-test the data-verify command end to end (build →
      # connect → probe → report) on every PR. The base database is
      # migrated first: since v0.29.57 the test packages run in databases
      # of their own and nothing else touches it. The residue check this
      # step also used to be — an integration test leaking rows that break
      # an invariant the battery rates FAIL (cached queue counts that
      # disagree with the tables, duplicate Default groups, case-variant
      # duplicate repos, new cross-kind message collisions) — now runs per
      # package, over each package's own database after its tests pass
      # (testdb.Main's verify hook), so it names the package that leaked.
      # The production and --ground-truth probes deliberately do NOT
      # run in CI (no prod credentials in Actions; ground truth needs
      # API keys + a DB with collected repos) — those are host-side
      # cron territory.
      - name: Run data-verify against the CI database
        run: |
          go build -o /tmp/aveloxis ./cmd/aveloxis
          cat > /tmp/ci-verify.json <<'CFG'
          {"database": {"host": "localhost", "port": 5432,
            "dbname": "aveloxis_test", "user": "aveloxis_test",
            "password": "aveloxis_test", "sslmode": "disable"}}
          CFG
          /tmp/aveloxis migrate -c /tmp/ci-verify.json
          /tmp/aveloxis data-verify -c /tmp/ci-verify.json

  # The upgrade a host performs (0.29.107, after the PR #238 loops): the
  # BASE release — the PR's base branch, or the newest release tag on a
  # push — migrates an empty database and populates it; the HEAD release
  # then migrates that database the way the deploy ladders do (plain,
  # --skip-views, plain again) and the stamp, the seeded rows, the index
  # validity and data-verify must hold. The empty-database golden cannot
  # see a same-release column+index ordering (SR-8), a CONCURRENTLY index
  # over existing rows (SR-2) or a once-only step that is not; this can.
  upgrade-path:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aveloxis_test
          POSTGRES_PASSWORD: aveloxis_test
          POSTGRES_DB: aveloxis_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: America/Chicago
      PGTZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the head release
        run: go build -o "$RUNNER_TEMP/aveloxis-head" ./cmd/aveloxis
      # A pull request upgrades from its base branch; a push upgrades from
      # the newest release tag (what a host runs).
      - name: Build the base release
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then ref="origin/$BASE_REF"; else ref=$(git tag --list 'v*' --sort=-v:refname | head -1); fi
          [ -n "$ref" ] || { echo "no base ref: no base branch and no v* tag"; exit 1; }
          echo "base ref: $ref ($(git rev-parse --short "$ref"))"
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$ref" | tar -x -C "$RUNNER_TEMP/base"
          (cd "$RUNNER_TEMP/base" && GOWORK=off go build -o "$RUNNER_TEMP/aveloxis-base" ./cmd/aveloxis)
      - name: Upgrade the populated database from base to head
        env:
          BASE_BIN: ${{ runner.temp }}/aveloxis-base
          HEAD_BIN: ${{ runner.temp }}/aveloxis-head
          CFG: ${{ runner.temp }}/ci-upgrade.json
          PGURL: postgres://aveloxis_test:aveloxis_test@localhost:5432/aveloxis_upgrade?sslmode=disable
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A push whose head still carries the newest tag's version (a branch
          # cut from the tagged commit, a docs-only push after a release) has
          # nothing to upgrade: a notice, not a failure. On a pull request equal
          # versions mean a missing bump and stay a failure.
          SAME_VERSION_OK: ${{ github.event_name != 'pull_request' }}
        run: |
          cat > "$CFG" <<'CFG'
          {"database": {"host": "localhost", "port": 5432,
            "dbname": "aveloxis_upgrade", "user": "aveloxis_test",
            "password": "aveloxis_test", "sslmode": "disable"}}
          CFG
          scripts/ci-upgrade-path.sh

  # The three processes a deployment runs, started from one binary against
  # one database, and the contracts BETWEEN them exercised over HTTP
  # (0.29.107): the API refuses an anonymous call; a web session exchanges
  # for a Bearer token; the web guard refuses a multipart or over-size form
  # before any gate; privilege is read per request; a sign-out in web is a
  # 401 in api at once; serve starts on the migrated database and every
  # process stops cleanly on SIGTERM. The run's own token is serve's one
  # API key (serve refuses to start without one); nothing is collected.
  processes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aveloxis_test
          POSTGRES_PASSWORD: aveloxis_test
          POSTGRES_DB: aveloxis_processes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: America/Chicago
      PGTZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o "$RUNNER_TEMP/aveloxis" ./cmd/aveloxis
      - name: Run serve, api and web and exercise the contracts between them
        env:
          BIN: ${{ runner.temp }}/aveloxis
          CFG: ${{ runner.temp }}/ci-processes.json
          PGURL: postgres://aveloxis_test:aveloxis_test@localhost:5432/aveloxis_processes?sslmode=disable
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_ADDR: 127.0.0.1:8082
          API_ADDR: 127.0.0.1:8383
          LOGDIR: ${{ runner.temp }}/process-logs
        run: |
          mkdir -p "$LOGDIR"
          cat > "$CFG" <<'CFG'
          {"database": {"host": "localhost", "port": 5432,
            "dbname": "aveloxis_processes", "user": "aveloxis_test",
            "password": "aveloxis_test", "sslmode": "disable"},
           "api": {"addr": "127.0.0.1:8383", "require_auth": true,
            "exempt_cidrs": ["192.0.2.0/24"],
            "rate_limit_rps": 100, "rate_limit_burst": 100},
           "web": {"addr": "127.0.0.1:8082", "dev_mode": true,
            "base_url": "http://127.0.0.1:8082",
            "api_internal_url": "http://127.0.0.1:8383"}}
          CFG
          scripts/ci-process-contracts.sh
      - name: Keep the three processes' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: process-logs
          path: ${{ runner.temp }}/process-logs
          if-no-files-found: ignore
